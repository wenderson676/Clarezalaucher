name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36.1"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "platform-tools"

      - name: Create .env
        run: |
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=dummy" > .env

      - name: Create google-services.json
        run: |
          mkdir -p app/src

          cat > app/src/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.vidasimples.zkvmap"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify debug keystore
        run: |
          ls -lh debug.keystore
          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.daemon=false"

      - name: Find APK
        run: |
          echo "APK(s) encontrados:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Check APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK criado com sucesso!"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clareza-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
